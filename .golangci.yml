version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - misspell
    - unconvert
    - unparam
    - errorlint

formatters:
  enable:
    - goimports

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
