name: Build OTel collector image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build from (defaults to current branch)'
        required: false
        type: string

jobs:
  build-docker:
    name: Build otelcol-opendata image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/otel-collector
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute image tag
        id: tag
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          SHA="$(git rev-parse --short HEAD)"
          SAFE_REF="$(echo "$REF" | sed 's|/|-|g')"
          TAG="${SAFE_REF}-${SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: otel-collector/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Output image URI
        run: |
          echo "## Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GHCR package visibility may default to private; flip to public in org settings if EKS pulls 401." >> "$GITHUB_STEP_SUMMARY"
