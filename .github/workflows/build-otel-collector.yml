name: Build OTel collector image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit SHA to build from (defaults to current branch)'
        required: false
        type: string

jobs:
  build-docker:
    name: Build otelcol-opendata image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/otel-collector
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compute image tags
        id: tag
        run: |
          REF="${{ inputs.ref || github.ref_name }}"
          SHA="$(git rev-parse --short HEAD)"
          SAFE_REF="$(echo "$REF" | sed 's|/|-|g')"
          BASE_TAG="${SAFE_REF}-${SHA}"

          # Always emit the base <ref>-<sha> tag for traceability.
          TAGS=("${IMAGE_NAME}:${BASE_TAG}")

          # If the ref is a root-module semver tag (vX.Y.Z), also emit
          # clean aliases so downstream consumers can pin :vX.Y.Z, :vX.Y,
          # or :latest instead of the <ref>-<sha> form.
          if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            TAGS+=("${IMAGE_NAME}:${REF}")
            TAGS+=("${IMAGE_NAME}:v${MAJOR}.${MINOR}")
            TAGS+=("${IMAGE_NAME}:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "primary_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Tags to publish:"
          printf '  %s\n' "${TAGS[@]}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: otel-collector/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Output image URIs
        run: |
          echo "## Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags pushed:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tag.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "GHCR package visibility may default to private; flip to public in org settings if EKS pulls 401." >> "$GITHUB_STEP_SUMMARY"
