name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Root Module
            module: .
            go_version_file: go.mod
            targets: ./ingest ./objstore ./test/compat-producer
          - name: Exporter Module
            module: exporter/opendataexporter
            go_version_file: exporter/opendataexporter/go.mod
            targets: ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go_version_file }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: ${{ matrix.targets }}

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Root Module
            module: .
            go_version_file: go.mod
            targets: ./ingest ./objstore ./test/compat-producer
          - name: Exporter Module
            module: exporter/opendataexporter
            go_version_file: exporter/opendataexporter/go.mod
            targets: ./...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go_version_file }}
      - run: go test -race ${{ matrix.targets }}
        working-directory: ${{ matrix.module }}

  compat-test:
    name: Compatibility Test
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: test/compat-consumer
      - run: ./scripts/compat-test.sh

  exporter-e2e:
    name: Exporter E2E
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: exporter/opendataexporter/go.mod
      - run: go test -tags=e2e -v ./e2e
        working-directory: exporter/opendataexporter
